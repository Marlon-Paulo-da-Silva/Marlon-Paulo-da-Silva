name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d3af1b&color_dots=#ebedf0,#fff1c1,#ffd95b,#ffb74d,#d3af1b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd95b&color_dots=#161b22,#4d3d0a,#8a6d12,#c19a1a,#ffd95b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
