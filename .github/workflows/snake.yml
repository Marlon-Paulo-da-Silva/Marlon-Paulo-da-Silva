name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d79921&color_dots=#ebdbb2,#f2d58a,#fabd2f,#d79921,#b57614
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fabd2f&color_dots=#3c3836,#665c54,#b57614,#d79921,#fabd2f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
